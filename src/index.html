<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SocialBook</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <div class="nav-left">
            <a href="#"><img class="logo" src="/images/logo.png" alt="my logo" /></a>

            <nav>
                <ul>
                    <li>
                        <a href="#"><img src="/images/notification.png" alt="Notifications icon" /></a>
                    </li>
                    <li>
                        <a href="#"><img src="/images/inbox.png" alt="Message icon" /></a>
                    </li>
                    <li>
                        <a href="#"><img src="/images/video.png" alt="Video icon" /></a>
                    </li>
                </ul>
            </nav>
        </div>
        <div class="nav-right">
            <div class="search-box">
                <img src="/images/search.png" alt="Search icon" />
                <input type="search" placeholder="Search" />
            </div>
            <div class="nav-user-icon online">
                <img src="/images/profile-pic.png" alt="Profile picture image" />
            </div>
        </div>
    </header>

    <section class="container">
        <!-- Left Side bar -->
        <aside class="left-sidebar">
            <div class="imp-links">
                <a href="#"><img src="/images/news.png" alt="news" /> Latest news</a>
                <a href="#"><img src="/images/friends.png" alt="friends" /> Friends</a>
                <a href="#"><img src="/images/group.png" alt="group" /> Group</a>
                <a href="#"><img src="/images/marketplace.png" alt="market place" /> Marketplace
                </a>
                <a href="#"><img src="/images/watch.png" alt="watch" /> Watch</a>
                <a href="#">See More</a>
            </div>

            <div class="shortcut-links">
                <p>Your Shortcuts</p>
                <a href="#"><img src="/images/shortcut-1.png" alt="shortcut 1" />Web Developers
                </a>
                <a href="#"><img src="/images/shortcut-2.png" alt="shortcut 2" />Web Design Course
                </a>
                <a href="#"><img src="/images/shortcut-3.png" alt="shortcut 3" />Full Stack Development
                </a>
                <a href="#"><img src="/images/shortcut-4.png" alt="shortcut 4" />Website Experts
                </a>
            </div>
        </aside>

        <!-- main Content -->
        <main class="main-content"></main>

        <!-- Right Side bar -->
        <aside class="right-sidebar"></aside>
    </section>
</body>

</html>
