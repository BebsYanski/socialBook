<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SocialBook</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <div class="nav-left">
        <img class="logo" src="/images/logo.png" alt="my logo" />
        <nav>
          <ul>
            <li>
              <img src="/images/notification.png" alt="Notifications icon" />
            </li>
            <li>
              <img src="/images/inbox.png" alt="Message icon" />
            </li>
            <li>
              <img src="/images/video.png" alt="Video icon" />
            </li>
          </ul>
        </nav>
      </div>
      <div class="nav-right">
        <div class="search-box">
          <img src="/images/search.png" alt="Search icon" />
          <input type="search" placeholder="Search" />
        </div>
        <div class="nav-user-icon online">
          <img src="/images/profile-pic.png" alt="Profile picture image" />
        </div>
      </div>
    </header>
  </body>
</html>
